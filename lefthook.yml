# Shared hooks live in voidflow (pre-commit, commit-msg hint, pre-push).
# Pin to a release tag; Renovate bumps it. A site's lefthook.yml can add
# commands but not override these; differences go through package.json scripts
# (here: test:unit:precommit skips tests that need a built dist/).
remotes:
  - git_url: https://github.com/taraxvoid/voidflow
    ref: v0.10.1
    configs:
      - lefthook/site.yml

pre-commit:
  commands:
    compress-images:
      # Compress uploads here (not only in the build) so the compressed bytes
      # land in this commit; otherwise the first build, at pre-push, rewrites
      # the file and leaves a dirty tree after the uncompressed one was committed.
      priority: 2
      glob: "public/images/uploads/**"
      run: bun run compress:images
      stage_fixed: true
