name: License check

# Blocks the GPL/AGPL/SSPL copyleft family from entering the production
# dependency tree. The deny list lives in package.json's `check:licenses`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: license-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-licenses:
    name: Check dependency licenses (block GPL family)
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Check dependency licenses
        run: bun run check:licenses
