name: Ensure PR mergable

# NOTE: this repo has `sha_pinning_required` enabled, so every `uses:` must
# name a full commit SHA. A version tag (`@v4`) makes the whole workflow fail
# at startup in 0s with no logs and no annotation. Keep the `# vN` trailing
# comment so the intended version stays readable.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Playwright browser binaries (Chromium). Cache hit => no ~2min download.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Validate workflow files before running the expensive checks.
      - run: bun run lint:actions
      # Advisory only: reports high/critical vulns without blocking the gate.
      # Flip continue-on-error to false once transitive deps are clean.
      - name: Audit dependencies
        run: bun audit --audit-level high
        continue-on-error: true
      - run: bun run lint
      # Build first: test/build.test.ts asserts against dist/, and the e2e
      # preview server serves it. Everything downstream reuses this build.
      - run: bun run build
      - run: bun run check            # astro check (type-check)
      - run: bun run test:unit
      # Mobile-chrome only on PRs; the full project matrix runs on push to main.
      - run: bun run test:e2e:only

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-e2e-report
          path: |
            playwright-report/
            test-results/
