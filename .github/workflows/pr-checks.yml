name: Ensure PR mergable

# NOTE: this repo has `sha_pinning_required` enabled, so every `uses:` must
# name a full commit SHA. A version tag (`@v4`) makes the whole workflow fail
# at startup in 0s with no logs and no annotation. Keep the `# vN` trailing
# comment so the intended version stays readable.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-checks:
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    # 20 min was tight for install + `playwright install --with-deps` + lint +
    # build + check + unit + e2e on a cold cache; matches e2e.yml's headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Playwright browser binaries (Chromium). Cache hit => no ~2min download.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Validate workflow files before running the expensive checks.
      - run: bun run lint:actions
      # Advisory only: reports high/critical vulns without blocking the gate.
      # Flip continue-on-error to false once transitive deps are clean.
      - name: Audit dependencies
        run: bun audit --audit-level high
        continue-on-error: true
      - run: bun run lint
      # Build first: test/build.test.ts asserts against dist/, and the e2e
      # preview server serves it. Everything downstream reuses this build.
      - run: bun run build
      - run: bun run check            # astro check (type-check)
      - run: bun run test:unit
      # Mobile-chrome only on PRs; the full project matrix runs on push to main.
      - run: bun run test:e2e:only

      - name: Check for bun.lock changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: lockfile
        with:
          filters: |
            lockfile:
              - 'bun.lock'

      - name: Check dependency licenses (block GPL family)
        if: steps.lockfile.outputs.lockfile == 'true'
        run: bun run check:licenses

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-e2e-report
          path: |
            playwright-report/
            test-results/
