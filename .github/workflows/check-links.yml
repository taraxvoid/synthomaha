name: Check Links

# Dead-link checker powered by Lychee.
# Validates external URLs + internal anchors against the built dist/ HTML, so it
# checks what is actually published — musician social links and event venue
# links are the ones that rot. Weekly all-links scan (cron) + PR gate that posts
# failures as a PR comment via peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday 9am UTC — full scan to catch stale/dead links
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: check-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # to post the PR comment

jobs:
  link-check:
    # schedule / workflow_dispatch have no pull_request context; the guard is a
    # no-op for those and correctly skips draft PRs.
    if: "!github.event.pull_request.draft"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Persist Lychee's result cache across cold starts. With max_cache_age = 1d,
      # the weekly run re-checks everything; PR runs only re-check URLs older than
      # 1 day (approximating "only new links").
      - name: Cache lychee results
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: ${{ runner.os }}-lychee-${{ hashFiles('src/content/**') }}
          restore-keys: ${{ runner.os }}-lychee-

      - name: Check links with Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # fail: true is REQUIRED — the action defaults to false (would NOT block)
          fail: true
          failIfEmpty: true
          format: markdown
          output: lychee-report.md
          jobSummary: true
          # The glob is scoped to dist/ deliberately: a bare "**/*.html" also
          # sweeps node_modules (Playwright ships broken-by-design HTML fixtures)
          # and fails the gate on links that aren't ours.
          args: "--config .lychee.toml --verbose --root-dir dist \"dist/**/*.html\""

      - name: Upload link-check report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: link-report
          path: lychee-report.md

      # Marker lets the next run find and replace this comment instead of
      # stacking a new one on every push to the PR.
      - name: Tag report for comment de-duplication
        if: failure() && github.event_name == 'pull_request'
        run: |
          printf '%s\n\n' '<!-- lychee-link-report -->' | cat - lychee-report.md > report.tmp
          mv report.tmp lychee-report.md

      - name: Find previous link-check comment
        if: failure() && github.event_name == 'pull_request'
        id: prev-comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- lychee-link-report -->"

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          # Empty on the first failure => creates; set thereafter => replaces.
          comment-id: ${{ steps.prev-comment.outputs.comment-id }}
          body-path: lychee-report.md
          edit-mode: replace
