# Use DecapBridge PKCE auth since Netlify Identity was deprecated 2025

backend:
    name: git-gateway
    repo: taraxvoid/synthomaha
    branch: main
    auth_type: pkce
    base_url: https://auth.decapbridge.com
    auth_endpoint: /sites/f9f431f3-1bdf-43e8-b2d1-1d8eacbf1760/pkce
    auth_token_endpoint: /sites/f9f431f3-1bdf-43e8-b2d1-1d8eacbf1760/token
    gateway_url: https://gateway.decapbridge.com

publish_mode: editorial_workflow
logo_url: https://synthomaha.net/images/logo.png
media_folder: public/images/uploads
public_folder: /images/uploads

# Enable PKCE fields (optional, recommended)
auth:
    email_claim: email

# Add site links in Decap CMS (optional)
site_url: https://synthomaha.net

# Enable for local testing with `bunx decap-server`
local_backend:
    true

    # See who did what (optional)
commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}}>
    update: Update {{collection}} “{{slug}}” - {{author-name}}>
    delete: Delete {{collection}} “{{slug}}” - {{author-name}}>
    uploadMedia: Upload “{{path}}” - {{author-name}}>
    deleteMedia: Delete “{{path}}” - {{author-name}}>
    openAuthoring: Message {{message}} - {{author-name}}>

collections:
    - name: events
      label: Events
      folder: src/content/events
      create: true
      delete: true
      slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
      extension: yaml
      format: yaml
      fields:
          - { name: title, label: Title, widget: string }
          - name: date
            label: Date
            widget: datetime
            format: 'YYYY-MM-DD'
            date_format: 'YYYY-MM-DD'
            time_format: false
          - { name: time, label: Start Time, widget: string, hint: '24h format, e.g. 20:00' }
          - { name: endTime, label: End Time, widget: string, required: false, hint: '24h format, e.g. 22:00 — defaults to 2 hours after start if omitted' }
          - { name: location, label: Location, widget: string }
          - { name: description, label: Description, widget: text }
          - { name: price, label: Price, widget: string, hint: 'Use 0 for free events' }
          - { name: image, label: Event Image, widget: image, required: false }

    - name: musicians
      label: Musicians
      folder: src/content/musicians
      create: true
      delete: true
      identifier_field: name
      slug: '{{slug}}'
      extension: yaml
      format: yaml
      fields:
          - { name: name, label: Stage Name, widget: string }
          - { name: bio, label: Bio, widget: text, required: false }
          - { name: profileImage, label: Profile Image, widget: image, required: false }
          - { name: bandcamp, label: Bandcamp URL, widget: string, required: false }
          - { name: soundcloud, label: SoundCloud URL, widget: string, required: false }
          - { name: instagram, label: Instagram Handle, widget: string, required: false, hint: 'e.g. @handle' }
          - { name: website, label: Website URL, widget: string, required: false }
          - { name: hidden, label: Hide this profile on the site, widget: boolean, required: false, default: true }
